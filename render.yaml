services:
  # ──── Backend: Node/Express Web Service ────
  - type: web
    name: crm-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: apt-get update -y && apt-get install -y ffmpeg && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: "10000"
      # ── AI / STT keys (set in Render dashboard, not here) ──
      # OPENAI_API_KEY      — OpenAI Whisper STT + аналитика
      # ELEVENLABS_API_KEY  — ElevenLabs Scribe STT (диаризация)
      # AISHA_AI_API_KEY    — KotibAI/AISHA узбекский STT
      # CLAUDE_API_KEY      — Anthropic Claude (слияние 3 транскриптов)
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AISHA_AI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      # Supabase Auth (admin / superadmin)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ──── Frontend: Vite Static Site ────
  - type: web
    name: crm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    headers:
      # X-Frame-Options: DENY убран — CRM открывается внутри Telegram (Web App работает через iframe
      # на Telegram Desktop/Web). Вместо него — CSP frame-ancestors с явным списком разрешённых источников.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://web.telegram.org https://*.web.telegram.org"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # Опционально — если не заданы, фронт подтянет url/anonKey с backend /api/supabase-auth/config
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

databases:
  - name: crm-db
    databaseName: crm_db
    user: crm_user
    region: oregon
    plan: free
